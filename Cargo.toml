[workspace]
resolver = "2"
members = [
    "crates/core_voxel",
    "crates/core_world",
    "crates/core_sim",
    "crates/core_city",
    "crates/core_blueprint",
    "crates/core_rooms",
    "crates/server",
    "crates/bench",
    "crates/godot_ext",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.dependencies]
core_voxel = { path = "crates/core_voxel" }
core_world = { path = "crates/core_world" }
core_sim = { path = "crates/core_sim" }
core_city = { path = "crates/core_city" }
core_blueprint = { path = "crates/core_blueprint" }
core_rooms = { path = "crates/core_rooms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
zip = { version = "9", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
