[workspace]
resolver = "2"
members = [
    "crates/core_voxel",
    "crates/core_world",
    "crates/core_sim",
    "crates/server",
    "crates/bench",
    "crates/godot_ext",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.dependencies]
core_voxel = { path = "crates/core_voxel" }
core_world = { path = "crates/core_world" }
core_sim = { path = "crates/core_sim" }

[profile.release]
lto = "thin"
codegen-units = 1
