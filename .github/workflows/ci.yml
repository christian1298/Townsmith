name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build GDExtension
        run: cargo build -p godot_ext

  # Windows stays a separate job (not a matrix leg) so the existing required
  # check name "Rust" is unchanged and the Windows leg can be skipped or
  # debugged without renaming the Linux gate.
  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      # The Windows images default to core.autocrlf=true. Pin LF so the
      # Windows build sees byte-identical sources to Linux; rustfmt and the
      # Godot resource loader both expect LF.
      - name: Use LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `cargo fmt` is platform-independent and already enforced by the
      # Linux job; skipping it here avoids duplicate work and line-ending noise.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # `cargo test` only builds test harnesses; this links the GDExtension
      # cdylib as a real Windows DLL, which is the Phase 0 deliverable.
      - name: Build workspace
        run: cargo build --workspace
      - name: Verify GDExtension DLL
        shell: pwsh
        run: |
          $dll = "target/debug/townsmith_core.dll"
          if (-not (Test-Path $dll)) {
            throw "Missing $dll - the GDExtension cdylib did not link on Windows"
          }
          Get-Item $dll | Select-Object Name, Length

  godot-smoke:
    name: Godot headless smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 libpulse0 libx11-6 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libgl1 libfontconfig1 libfreetype6 libdbus-1-3 \
            unzip
      - name: Install Godot 4.7.2
        run: |
          GODOT_VERSION="4.7.2"
          GODOT_ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/$GODOT_ZIP" "$BASE/$GODOT_ZIP"
          curl -fsSL -o "$RUNNER_TEMP/SHA512-SUMS.txt" "$BASE/SHA512-SUMS.txt"
          (cd "$RUNNER_TEMP" && grep -E "[ *]${GODOT_ZIP}$" SHA512-SUMS.txt | sha512sum -c -)
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Verify Godot
        run: '"$GODOT" --version'
      - name: Run headless smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_godot.sh 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
      - name: Run locale smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_locale.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run city benchmark smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_city.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run voxel instance benchmark smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_voxel.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run volume editor smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_volume.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run editor shell smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_editor.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run blueprint save/load smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_blueprint.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run slice house benchmark smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_slice.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run slice acceptance smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_acceptance.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run world placement smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_world_placement.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run world placement scene smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_world_scene.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Run EN/DE layout smoke
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/smoke_layout.sh 2>&1 | tee -a "$RUNNER_TEMP/godot-smoke.log"
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-log
          path: ${{ runner.temp }}/godot-smoke.log
          if-no-files-found: warn
